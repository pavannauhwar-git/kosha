name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: "http://localhost:54321"
      VITE_SUPABASE_ANON_KEY: "dummy-key"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit -- --run
      - name: Run offline integration tests
        run: npm run test:no-network

  version-changelog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check version in changelog
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "version: '$VERSION'" src/lib/changelog.js; then
            echo "Version $VERSION not found in src/lib/changelog.js"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  deploy-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit-tests, build]
    concurrency:
      group: live-supabase-readiness
      cancel-in-progress: false
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_EXPECTED_PROJECT_REF: ${{ secrets.E2E_EXPECTED_PROJECT_REF }}
      E2E_SESSION_EMAIL: ${{ secrets.E2E_SESSION_EMAIL }}
      E2E_SESSION_PASSWORD: ${{ secrets.E2E_SESSION_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check readiness secret availability
        id: readiness-secrets
        run: |
          missing=0
          [[ -z "$VITE_SUPABASE_URL" ]] && missing=1
          [[ -z "$VITE_SUPABASE_ANON_KEY" ]] && missing=1
          [[ -z "$E2E_EXPECTED_PROJECT_REF" ]] && missing=1
          [[ -z "$E2E_SESSION_EMAIL" ]] && missing=1
          [[ -z "$E2E_SESSION_PASSWORD" ]] && missing=1

          if [[ "$missing" -eq 1 ]]; then
            if [[ "${{ github.actor }}" == "dependabot[bot]" || ( "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ) ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Deploy readiness checks skipped on forks and Dependabot PRs because required secrets are not configured."
            else
              echo "Required secrets are missing on a same-repo push/PR. Failing."
              exit 1
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 'Runtime test: deploy readiness'
        if: ${{ steps.readiness-secrets.outputs.skip != 'true' }}
        run: npm run test:deploy-readiness

  runtime-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, unit-tests, build, deploy-readiness]
    # The live tests share one set of accounts, so runs from different
    # branches must queue instead of overlapping.
    concurrency:
      group: live-supabase-runtime
      cancel-in-progress: false
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_EXPECTED_PROJECT_REF: ${{ secrets.E2E_EXPECTED_PROJECT_REF }}
      APP_BASE_URL: http://localhost:5173
      E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
      E2E_JOINER_EMAIL: ${{ secrets.E2E_JOINER_EMAIL }}
      E2E_JOINER_PASSWORD: ${{ secrets.E2E_JOINER_PASSWORD }}
      E2E_SESSION_EMAIL: ${{ secrets.E2E_SESSION_EMAIL }}
      E2E_SESSION_PASSWORD: ${{ secrets.E2E_SESSION_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check runtime secret availability
        id: runtime-secrets
        run: |
          missing=0
          [[ -z "$VITE_SUPABASE_URL" ]] && missing=1
          [[ -z "$VITE_SUPABASE_ANON_KEY" ]] && missing=1
          [[ -z "$E2E_EXPECTED_PROJECT_REF" ]] && missing=1
          [[ -z "$E2E_CREATOR_EMAIL" ]] && missing=1
          [[ -z "$E2E_CREATOR_PASSWORD" ]] && missing=1
          [[ -z "$E2E_JOINER_EMAIL" ]] && missing=1
          [[ -z "$E2E_JOINER_PASSWORD" ]] && missing=1
          [[ -z "$E2E_SESSION_EMAIL" ]] && missing=1
          [[ -z "$E2E_SESSION_PASSWORD" ]] && missing=1

          if [[ "$missing" -eq 1 ]]; then
            if [[ "${{ github.actor }}" == "dependabot[bot]" || ( "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ) ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Runtime verification skipped on forks and Dependabot PRs because required secrets are not configured."
            else
              echo "Required secrets are missing on a same-repo push/PR. Failing."
              exit 1
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 'Runtime test: join flow'
        if: ${{ steps.runtime-secrets.outputs.skip != 'true' }}
        run: npm run test:join-flow
      - name: 'Runtime test: RLS partner isolation'
        if: ${{ steps.runtime-secrets.outputs.skip != 'true' }}
        run: npm run test:rls-partner-isolation
      - name: 'Runtime test: splitwise mutation paths'
        if: ${{ steps.runtime-secrets.outputs.skip != 'true' }}
        run: npm run lint:splitwise-mutation-paths
      - name: 'Runtime test: splitwise viewer invite flow'
        if: ${{ steps.runtime-secrets.outputs.skip != 'true' }}
        run: npm run test:splitwise-viewer-invite-flow
      - name: 'Runtime test: liabilities realtime'
        if: ${{ steps.runtime-secrets.outputs.skip != 'true' }}
        run: npm run test:liabilities-realtime
      - name: 'Runtime test: mutation stress'
        if: ${{ steps.runtime-secrets.outputs.skip != 'true' }}
        run: npm run test:mutation-stress
