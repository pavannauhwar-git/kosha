<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description"
    content="Kosha is a personal finance PWA for tracking transactions, bills, loans, and insights with realtime sync." />

  <!-- PWA theme -->
  <meta name="theme-color" content="#0B57D0" />
  <meta name="application-name" content="Kosha" />

  <!-- iOS PWA — all three meta tags required -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kosha" />

  <!-- apple-touch-icon: provide all sizes + unsized fallback.
         iOS reads the best-matching size; older devices use the unsized fallback.
         No leading slash — more reliable on Vercel's CDN edge nodes. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" href="/favicon.ico" />

  <!-- Font preload — Latin Variable Inter (wght axis) served from stable public path -->
  <link
    rel="preload"
    href="/fonts/inter-latin-wght-normal.woff2"
    as="font"
    type="font/woff2"
    crossorigin="anonymous"
  />

  <title>Kosha — Your Financial Sheath</title>
  <!-- Instant Theme Application to prevent FOUC -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('kosha-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (!stored && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F0F11');
        } else {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F0F4F9');
        }
      } catch (e) { }
    })();
  </script>

  <style>
    /* ── Instant-paint branded splash shell ────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F0F4F9;
      font-family: 'InterVariable', 'Inter', system-ui, -apple-system, sans-serif;
      font-display: swap;
      -webkit-font-smoothing: antialiased;
    }

    html.dark body {
      background-color: #0F0F11;
    }

    /* Full-screen loader */
    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 0;
      position: relative;
    }

    /* Center brand mark */
    .initial-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px);
      animation: splash-rise 0.42s cubic-bezier(0.05, 0.7, 0.1, 1) 0.05s both;
    }

    /* App icon mark */
    .initial-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(11, 87, 208, 0.28), 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .initial-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    html.dark .initial-logo {
      box-shadow: 0 8px 28px rgba(168, 199, 250, 0.38), 0 2px 10px rgba(0, 0, 0, 0.30);
    }

    .initial-wordmark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1F1F1F;
      line-height: 1;
    }

    html.dark .initial-wordmark {
      color: #E3E3E3;
    }

    .initial-tagline {
      font-size: 12px;
      font-weight: 400;
      color: #747775;
      letter-spacing: 0.01em;
      margin-top: -6px;
    }

    /* Bottom shimmer progress bar */
    .initial-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      overflow: hidden;
      opacity: 0;
      animation: splash-rise 0.4s ease 0.3s both;
    }

    .initial-progress-track {
      position: absolute;
      inset: 0;
      background: rgba(11, 87, 208, 0.12);
    }

    .initial-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -60%;
      width: 40%;
      background: linear-gradient(90deg, transparent 0%, #0B57D0 40%, #A8C7FA 60%, transparent 100%);
      animation: progress-sweep 1.4s cubic-bezier(0.4, 0, 0.6, 1) 0.35s infinite;
      border-radius: 0 2px 2px 0;
    }

    html.dark .initial-progress-bar {
      background: linear-gradient(90deg, transparent 0%, #A8C7FA 40%, #D3E3FD 60%, transparent 100%);
    }



    @keyframes splash-rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progress-sweep {
      0% {
        left: -60%;
      }

      100% {
        left: 120%;
      }
    }

    /* When React mounts it removes .initial-loader */
    #root:not(:has(.initial-loader)) .initial-loader {
      display: none;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="initial-loader">


      <!-- Centered brand -->
      <div class="initial-brand">
        <div class="initial-logo">
          <img src="/icons/icon-192.png" alt="Kosha" />
        </div>
        <div class="initial-wordmark">Kosha</div>
        <div class="initial-tagline">Your financial sheath</div>
      </div>

      <!-- Progress bar -->
      <div class="initial-progress">
        <div class="initial-progress-track"></div>
        <div class="initial-progress-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
